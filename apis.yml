name: Quest Software Inc.
description: >-
  Quest Software Inc. is a privately held IT management and cybersecurity
  software company headquartered in Aliso Viejo, California. Its portfolio spans
  database management and development (Toad), database and infrastructure
  performance monitoring (Foglight, Spotlight), unified endpoint management
  (KACE), Microsoft platform management and security (On Demand, Change Auditor,
  Recovery Manager, Migration Manager), data protection and backup (NetVault,
  QoreStor, Rapid Recovery), data replication (SharePlex), and data governance
  and modeling (erwin). Its products are distributed and supported through the
  Quest Support portal. Surfaced as a portfolio-lead stub and processed by the
  API Evangelist enrichment pipeline; no public, first-party developer API
  portal or OpenAPI surface was discoverable at enrichment time.
